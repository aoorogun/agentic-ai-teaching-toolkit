[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-teaching-toolkit"
version = "0.1.0"
description = "A modular agentic AI teaching toolkit for Computing curriculum use"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["agentcore", "agentcore.tools", "agentcore.providers"]
